<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ML Portal</title>
  <style>
    :root { color-scheme:light; font-family:Inter,system-ui,sans-serif; background:#eef3f8; color:#172033 }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(145deg,#dfeaf6 0,#f7f9fc 48%,#e9f3f0 100%) }
    main { width:min(780px,calc(100% - 32px)); padding:32px 0 }
    h1 { margin:0 0 20px; letter-spacing:-.03em }
    section { padding:26px; border:1px solid #d7e0ea; border-radius:18px; background:#fffffff2; box-shadow:0 20px 60px #30445f1f }
    header,.row { display:flex; align-items:center; justify-content:space-between; gap:16px }
    form,.list { display:grid; gap:14px }
    label { display:grid; gap:6px; color:#536174 }
    input { min-height:44px; padding:11px 12px; border:1px solid #c7d2df; border-radius:10px; background:#fff; color:#172033; font:inherit }
    input:focus { outline:3px solid #4f7cff24; border-color:#4f7cff }
    button { min-height:44px; padding:10px 16px; border:0; border-radius:10px; background:#356df3; color:#fff; font-weight:700; cursor:pointer }
    button:disabled { cursor:not-allowed; opacity:.5 }
    .secondary { background:#e8eef6; color:#26364c }
    .database { padding:16px; border:1px solid #d9e2ec; border-radius:13px; background:#f8fafc }
    .database strong { display:block; margin-bottom:4px }
    small,.hint { color:#6b788b }
    .access { display:inline-block; margin-left:8px; padding:2px 7px; border-radius:99px; background:#e4ecff; color:#3157ad }
    .error { color:#bd3043 }
    .hidden { display:none }
    @media (max-width:560px) { main { width:min(100% - 20px,780px); padding:16px 0 } section { padding:20px } .database.row { align-items:stretch; flex-direction:column } .database button { width:100% } }
  </style>
</head>
<body><main>
  <h1>ML Portal</h1>
  <section id="login-panel">
    <form id="login-form">
      <label>Пользователь<input id="login" autocomplete="username" required autofocus></label>
      <label>Пароль<input id="password" type="password" autocomplete="current-password" required></label>
      <div id="login-error" class="error"></div><button type="submit">Войти</button>
    </form>
  </section>
  <section id="portal-panel" class="hidden">
    <header><div><strong id="user"></strong><div class="hint">Выберите базу</div></div><button id="logout" class="secondary">Выйти</button></header>
    <form id="password-form" class="hidden">
      <p class="hint">Перед продолжением необходимо изменить временный пароль.</p>
      <label>Текущий пароль<input id="current-password" type="password" autocomplete="current-password" required></label>
      <label>Новый пароль<input id="new-password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Повторите новый пароль<input id="new-password-confirm" type="password" autocomplete="new-password" minlength="8" required></label>
      <div id="password-error" class="error"></div><button type="submit">Изменить пароль</button>
    </form>
    <div id="portal-content"><div id="portal-error" class="error"></div><div id="database-list" class="list"></div><p id="empty" class="hint">Нет доступных баз.</p></div>
  </section>
</main><script>
  const loginPanel=document.querySelector('#login-panel'),portalPanel=document.querySelector('#portal-panel');
  async function openDatabase(item){const error=document.querySelector('#portal-error');error.textContent='';const result=await fetch(`/api/databases/${item.id}/open`,{method:'POST',headers:{'X-ML-CSRF':'1'}});if(result.ok){location.href=(await result.json()).url;return}error.textContent=(await result.text()).trim()||'Не удалось открыть базу'}
  async function loadPortal(){
    const response=await fetch('/api/portal'); if(!response.ok){loginPanel.classList.remove('hidden');portalPanel.classList.add('hidden');return}
    const data=await response.json(); loginPanel.classList.add('hidden');portalPanel.classList.remove('hidden');document.querySelector('#user').textContent=data.session.login;document.querySelector('#password-form').classList.toggle('hidden',!data.session.mustChangePassword);document.querySelector('#portal-content').classList.toggle('hidden',data.session.mustChangePassword);
    const list=document.querySelector('#database-list');list.replaceChildren();document.querySelector('#portal-error').textContent='';document.querySelector('#empty').classList.toggle('hidden',data.databases.length!==0);
    for(const item of data.databases){const card=document.createElement('div');card.className='database row';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=item.name;const mode=document.createElement('small');const state=item.state==='running'?'Запущена':'Недоступна';mode.textContent=`${item.mode==='debug'?'Отладка':'Основная'} · ${state}`;const access=document.createElement('small');access.className='access';access.textContent=item.accessLevel==='owner'?'Владелец':'Доступ';info.append(name,mode,access);const open=document.createElement('button');open.textContent='Открыть';open.disabled=item.state!=='running'||!item.allowNewSessions;open.addEventListener('click',()=>openDatabase(item));card.append(info,open);list.append(card)}
  }
  document.querySelector('#login-form').addEventListener('submit',async event=>{event.preventDefault();const error=document.querySelector('#login-error');error.textContent='';const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.querySelector('#login').value,password:document.querySelector('#password').value})});document.querySelector('#password').value='';if(!response.ok){error.textContent='Неверный пользователь или пароль';return}await loadPortal()});
  document.querySelector('#password-form').addEventListener('submit',async event=>{event.preventDefault();const current=document.querySelector('#current-password'),next=document.querySelector('#new-password'),confirmation=document.querySelector('#new-password-confirm'),error=document.querySelector('#password-error');error.textContent='';if(next.value!==confirmation.value){error.textContent='Пароли не совпадают';return}const response=await fetch('/api/password',{method:'POST',headers:{'Content-Type':'application/json','X-ML-CSRF':'1'},body:JSON.stringify({currentPassword:current.value,newPassword:next.value})});current.value='';next.value='';confirmation.value='';if(!response.ok){error.textContent='Не удалось изменить пароль';return}await loadPortal()});
  document.querySelector('#logout').addEventListener('click',async()=>{await fetch('/api/logout',{method:'POST',headers:{'X-ML-CSRF':'1'}});await loadPortal()});loadPortal();
</script></body></html>
