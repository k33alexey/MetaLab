<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ML Studio</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,system-ui,sans-serif; background:#1e1f22; color:#dfe1e5 }
    * { box-sizing:border-box } body { margin:0; height:100vh; overflow:hidden }
    header { height:42px; display:flex; align-items:center; gap:18px; padding:0 14px; border-bottom:1px solid #393b40; background:#2b2d30 }
    header strong { color:#fff } .muted { color:#92959d; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .workspace { display:grid; grid-template-columns:300px minmax(320px,1fr) 300px; height:calc(100vh - 66px) }
    aside,main { min-width:0; overflow:auto } aside { background:#25262a } #tree-panel { border-right:1px solid #393b40 } #properties-panel { border-left:1px solid #393b40 }
    .panel-title { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; height:36px; padding:0 12px; background:#2b2d30; border-bottom:1px solid #393b40; font-size:12px; font-weight:700 }
    #tree { padding:7px 5px 24px } details { margin:1px 0 } summary,.leaf { min-height:27px; display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:5px; cursor:pointer; user-select:none; font-size:13px }
    summary { list-style:none } summary::-webkit-details-marker { display:none } summary::before { content:'›'; width:10px; color:#8c9098 } details[open]>summary::before { transform:rotate(90deg) }
    summary:hover,.leaf:hover,.selected { background:#3c3f45 } .children { margin-left:15px }
    .icon { color:#e8a765; font-size:11px } .leaf .icon { color:#6fa9e8 }
    main { display:grid; grid-template-rows:36px 1fr; background:#1e1f22 }
    .editor-bar { display:flex; align-items:center; gap:10px; padding:0 10px; border-bottom:1px solid #393b40; background:#25262a }
    .editor-bar #file-path { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:#aeb1b8 }
    #editor { width:100%; height:100%; resize:none; border:0; outline:0; padding:16px 20px; background:#1e1f22; color:#dfe1e5; tab-size:4; font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
    #editor:disabled { color:#777b84 }
    .welcome { width:min(620px,calc(100% - 48px)); padding:32px; border:1px solid #393b40; border-radius:12px; background:#25262a; box-shadow:0 18px 60px #0004 }
    .welcome h1 { margin:0 0 8px; font-size:25px } .welcome p { color:#a8abb3; line-height:1.55 }
    #properties { padding:8px 12px } .property { display:grid; grid-template-columns:minmax(90px,42%) 1fr; gap:10px; padding:7px 4px; border-bottom:1px solid #34363b; font-size:12px }
    .property span:first-child { color:#aeb1b8 } .property span:last-child { overflow-wrap:anywhere; color:#e1e3e7 }
    footer { height:24px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; border-top:1px solid #393b40; background:#2b2d30; color:#a8abb3; font-size:11px }
    .error { color:#ff7b86 } .warning { color:#e7b75f } button { border:0; border-radius:5px; padding:5px 9px; background:#3c3f45; color:#dfe1e5; cursor:pointer } button:hover { background:#4b4e55 } button:disabled { opacity:.45; cursor:default } .primary { background:#365880 } .primary:hover { background:#416b9b }
    dialog { width:min(920px,calc(100% - 40px)); height:min(700px,calc(100% - 40px)); padding:0; border:1px solid #4a4d54; border-radius:10px; background:#25262a; color:#dfe1e5; box-shadow:0 24px 90px #000b }
    dialog::backdrop { background:#0009 } .git-header,.git-actions { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #393b40 } .git-header strong { flex:1 }
    .git-body { display:grid; grid-template-columns:280px 1fr; height:calc(100% - 96px) } .git-sidebar { overflow:auto; padding:10px; border-right:1px solid #393b40 } .git-main { min-width:0; display:grid; grid-template-rows:1fr auto; padding:10px }
    #git-changes { display:grid; gap:3px; margin-top:8px } .git-change { display:flex; gap:8px; width:100%; text-align:left; font:12px ui-monospace,monospace } .git-change span:first-child { color:#e7b75f } .git-change.conflict span { color:#ff7b86 }
    #git-diff,#git-output { overflow:auto; margin:0; padding:12px; border-radius:6px; background:#1e1f22; color:#c8ccd4; white-space:pre-wrap; font:12px/1.45 ui-monospace,monospace } #git-output { max-height:90px; margin-top:8px }
    .git-fields { display:grid; gap:8px; padding-top:10px } .git-fields input,.git-fields select { min-width:0; padding:7px; border:1px solid #4a4d54; border-radius:5px; background:#1e1f22; color:#dfe1e5 }
    @media (max-width:850px) { .workspace { grid-template-columns:240px 1fr } #properties-panel { display:none } }
  </style>
</head>
<body>
  <header><strong>ML Studio</strong><span id="project-name"></span><span id="project-path" class="muted"></span><button id="git-open">Git</button><button id="refresh">Обновить</button></header>
  <div class="workspace">
    <aside id="tree-panel"><div class="panel-title"><span>ML Project</span></div><div id="tree"></div></aside>
    <main><div class="editor-bar"><span id="file-path">Выберите файл</span><button id="save" class="primary" disabled>Сохранить</button></div><textarea id="editor" spellcheck="false" disabled placeholder="Выберите YAML- или BSL-файл в дереве проекта"></textarea></main>
    <aside id="properties-panel"><div class="panel-title"><span>Свойства</span><span id="selection" class="muted"></span></div><div id="properties"></div></aside>
  </div>
  <footer><span id="status">Готово</span><span>UTF-8 · YAML · BSL</span></footer>
  <dialog id="git-dialog">
    <div class="git-header"><strong>Git</strong><span id="git-summary" class="muted"></span><button id="git-refresh">Обновить</button><button id="git-close">Закрыть</button></div>
    <div class="git-body">
      <div class="git-sidebar">
        <div class="git-fields"><select id="git-branch"></select><button id="git-switch">Переключить ветку</button><input id="git-new-branch" maxlength="240" placeholder="Новая ветка"><button id="git-create-branch">Создать ветку</button></div>
        <div id="git-changes"></div>
      </div>
      <div class="git-main"><pre id="git-diff">Выберите изменённый файл</pre><div><div class="git-fields"><input id="git-message" maxlength="4096" placeholder="Сообщение коммита"><button id="git-commit" class="primary">Создать commit</button></div><pre id="git-output"></pre></div></div>
    </div>
    <div class="git-actions"><button id="git-pull">Pull</button><button id="git-push">Push</button></div>
  </dialog>
  <script>
    const tree=document.querySelector('#tree'),properties=document.querySelector('#properties'),status=document.querySelector('#status'),editor=document.querySelector('#editor'),saveButton=document.querySelector('#save'),filePath=document.querySelector('#file-path');
    let selectedElement,currentFile=null,dirty=false,loadingFile=false;
    function editablePath(value){return value==='mlproject.yaml'||value?.endsWith('.yaml')||value?.endsWith('.bsl')}
    async function select(node,element){if(selectedElement)selectedElement.classList.remove('selected');selectedElement=element;element.classList.add('selected');document.querySelector('#selection').textContent=node.title;properties.replaceChildren();for(const item of node.properties||[]){const row=document.createElement('div');row.className='property';const name=document.createElement('span'),value=document.createElement('span');name.textContent=item.name;value.textContent=item.value;row.append(name,value);properties.append(row)}if(editablePath(node.path))await openFile(node.path)}
    function renderNode(node){if(node.children&&node.children.length){const details=document.createElement('details');details.open=node.id==='project'||node.id==='metadata';const summary=document.createElement('summary');const icon=document.createElement('span');icon.className='icon';icon.textContent='◆';const title=document.createElement('span');title.textContent=node.title;summary.append(icon,title);summary.addEventListener('click',event=>{event.stopPropagation();select(node,summary)});const children=document.createElement('div');children.className='children';for(const child of node.children)children.append(renderNode(child));details.append(summary,children);return details}const leaf=document.createElement('div');leaf.className='leaf';const icon=document.createElement('span');icon.className='icon';icon.textContent=node.kind==='group'||node.kind==='metadata-group'?'◆':'●';const title=document.createElement('span');title.textContent=node.title;leaf.append(icon,title);leaf.addEventListener('click',()=>select(node,leaf));return leaf}
    async function openFile(path){if(loadingFile||currentFile?.path===path)return;if(dirty&&!confirm('Текущий файл изменён. Отменить несохранённые изменения?'))return;loadingFile=true;status.textContent='Открытие файла…';const response=await fetch(`/api/file?path=${encodeURIComponent(path)}`);loadingFile=false;if(!response.ok){status.textContent=await response.text();status.className='error';return}currentFile=await response.json();editor.value=currentFile.content;editor.disabled=false;filePath.textContent=currentFile.path;dirty=false;saveButton.disabled=true;status.className='';status.textContent=`${currentFile.language.toUpperCase()} · Готово`}
    async function save(){if(!currentFile||!dirty)return;saveButton.disabled=true;status.className='';status.textContent='Сохранение…';const response=await fetch('/api/file',{method:'PUT',headers:{'Content-Type':'application/json','X-ML-CSRF':'1'},body:JSON.stringify({path:currentFile.path,content:editor.value,expectedRevision:currentFile.revision})});if(!response.ok){status.textContent=response.status===409?'Файл изменён вне Studio. Перезагрузите его и объедините изменения.':await response.text();status.className=response.status===409?'warning':'error';saveButton.disabled=false;return}currentFile=await response.json();editor.value=currentFile.content;dirty=false;saveButton.disabled=true;status.className='';status.textContent='Сохранено';await loadTree(false)}
    async function loadTree(selectRoot=true){status.textContent='Обновление…';status.className='';const response=await fetch('/api/project');if(!response.ok){status.textContent=await response.text();status.className='error';return}const data=await response.json();document.title=`ML Studio — ${data.manifest.title}`;document.querySelector('#project-name').textContent=data.manifest.title;document.querySelector('#project-path').textContent=data.projectPath;tree.replaceChildren(renderNode(data.tree));if(selectRoot)await select(data.tree,tree.querySelector('summary'));if(!dirty){status.className='';status.textContent='Готово'}}
    async function pollExternalChange(){if(!currentFile||loadingFile)return;const knownRevision=currentFile.externalRevision||currentFile.revision;const response=await fetch(`/api/file?path=${encodeURIComponent(currentFile.path)}`,{headers:{'If-None-Match':`"${knownRevision}"`}});if(response.status===304||!response.ok)return;const latest=await response.json();if(latest.revision===currentFile.revision){delete currentFile.externalRevision;return}if(dirty){currentFile.externalRevision=latest.revision;status.textContent='Файл изменён вне Studio. Сохранение заблокировано до перезагрузки.';status.className='warning';return}currentFile=latest;editor.value=latest.content;status.textContent='Загружены внешние изменения';status.className='warning'}
    const gitDialog=document.querySelector('#git-dialog'),gitOutput=document.querySelector('#git-output'),gitDiff=document.querySelector('#git-diff');
    async function refreshGit(clearOutput=true){if(clearOutput)gitOutput.textContent='';const [statusResponse,branchesResponse]=await Promise.all([fetch('/api/git/status'),fetch('/api/git/branches')]);if(!statusResponse.ok){gitOutput.textContent=await statusResponse.text();return}const data=await statusResponse.json(),branches=branchesResponse.ok?await branchesResponse.json():{current:data.branch,items:[data.branch]};const conflicts=data.entries.filter(entry=>entry.conflicted).length;document.querySelector('#git-summary').textContent=`${data.branch||'без ветки'} · ${data.entries.length} изменений${conflicts?` · конфликтов: ${conflicts}`:''}${data.ahead||data.behind?` · ↑${data.ahead} ↓${data.behind}`:''}`;const branch=document.querySelector('#git-branch');branch.replaceChildren();for(const name of branches.items){const option=document.createElement('option');option.value=option.textContent=name;option.selected=name===branches.current;branch.append(option)}const changes=document.querySelector('#git-changes');changes.replaceChildren();for(const entry of data.entries){const button=document.createElement('button');button.className=`git-change${entry.conflicted?' conflict':''}`;const code=document.createElement('span'),path=document.createElement('span');code.textContent=`${entry.index}${entry.worktree}`;path.textContent=entry.path;button.append(code,path);button.addEventListener('click',()=>showGitDiff(entry));changes.append(button)}if(!data.entries.length)changes.textContent='Нет изменений'}
    async function showGitDiff(entry){const response=await fetch(`/api/git/diff?path=${encodeURIComponent(entry.path)}`);if(!response.ok){gitDiff.textContent=await response.text();return}const data=await response.json();gitDiff.textContent=data.diff||(entry.index==='?'?'Новый файл. Diff появится после добавления в индекс.':'Нет текстовых различий')}
    async function gitAction(path,body){if(dirty){gitOutput.textContent='Сначала сохраните текущий файл.';return false}gitOutput.textContent='Выполнение…';const options={method:'POST',headers:{'X-ML-CSRF':'1'}};if(body!==undefined){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}const response=await fetch(path,options);const text=await response.text();if(!response.ok){gitOutput.textContent=text;return false}try{gitOutput.textContent=JSON.parse(text).output||'Готово'}catch{gitOutput.textContent='Готово'}await refreshGit(false);return true}
    document.querySelector('#git-open').addEventListener('click',()=>{gitDialog.showModal();refreshGit()});document.querySelector('#git-close').addEventListener('click',()=>gitDialog.close());document.querySelector('#git-refresh').addEventListener('click',refreshGit);
    document.querySelector('#git-commit').addEventListener('click',async()=>{if(await gitAction('/api/git/commit',{message:document.querySelector('#git-message').value}))document.querySelector('#git-message').value=''});document.querySelector('#git-pull').addEventListener('click',async()=>{if(await gitAction('/api/git/pull')){currentFile=null;await loadTree()}});document.querySelector('#git-push').addEventListener('click',()=>gitAction('/api/git/push'));
    document.querySelector('#git-switch').addEventListener('click',async()=>{if(await gitAction('/api/git/branches/switch',{name:document.querySelector('#git-branch').value,create:false})){currentFile=null;await loadTree()}});document.querySelector('#git-create-branch').addEventListener('click',async()=>{const input=document.querySelector('#git-new-branch');if(await gitAction('/api/git/branches/switch',{name:input.value,create:true})){input.value='';currentFile=null;await loadTree()}});
    editor.addEventListener('input',()=>{if(!currentFile)return;dirty=editor.value!==currentFile.content;saveButton.disabled=!dirty;status.className='';status.textContent=dirty?'Изменён':'Готово'});editor.addEventListener('keydown',event=>{if(event.key==='Tab'){event.preventDefault();const start=editor.selectionStart;editor.setRangeText('    ',start,editor.selectionEnd,'end');editor.dispatchEvent(new Event('input'))}if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save()}});saveButton.addEventListener('click',save);window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
    document.querySelector('#refresh').addEventListener('click',async()=>{if(dirty&&!confirm('Отменить несохранённые изменения и перечитать проект?'))return;dirty=false;currentFile=null;await loadTree()});loadTree();setInterval(pollExternalChange,3000);
  </script>
</body>
</html>
