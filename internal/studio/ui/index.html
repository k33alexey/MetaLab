<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ML Studio</title>
  <link rel="stylesheet" href="/ui/bsl-editor.css">
  <link rel="stylesheet" href="/ui/form-designer.css">
  <style>
    :root { color-scheme:dark; font-family:Inter,system-ui,sans-serif; background:#1e1f22; color:#dfe1e5 }
    * { box-sizing:border-box } body { margin:0; height:100vh; overflow:hidden }
    header { height:42px; display:flex; align-items:center; gap:18px; padding:0 14px; border-bottom:1px solid #393b40; background:#2b2d30 }
    header strong { color:#fff } .muted { color:#92959d; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .workspace { display:grid; grid-template-columns:300px minmax(320px,1fr) 300px; height:calc(100vh - 66px) }
    aside,main { min-width:0; overflow:auto } aside { background:#25262a } #tree-panel { border-right:1px solid #393b40 } #properties-panel { border-left:1px solid #393b40 }
    .panel-title { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; height:36px; padding:0 12px; background:#2b2d30; border-bottom:1px solid #393b40; font-size:12px; font-weight:700 }
    #tree { padding:7px 5px 24px } details { margin:1px 0 } summary,.leaf { min-height:27px; display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:5px; cursor:pointer; user-select:none; font-size:13px }
    summary { list-style:none } summary::-webkit-details-marker { display:none } summary::before { content:'›'; width:10px; color:#8c9098 } details[open]>summary::before { transform:rotate(90deg) }
    summary:hover,.leaf:hover,.selected { background:#3c3f45 } .children { margin-left:15px }
    .icon { color:#e8a765; font-size:11px } .leaf .icon { color:#6fa9e8 }
    main { display:grid; grid-template-rows:36px minmax(0,1fr); background:#1e1f22 }
    .editor-bar { display:flex; align-items:center; gap:10px; padding:0 10px; border-bottom:1px solid #393b40; background:#25262a }
    .editor-bar #file-path { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:#aeb1b8 }
    #editor { width:100%; height:100%; resize:none; border:0; outline:0; padding:16px 20px; background:#1e1f22; color:#dfe1e5; tab-size:4; font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
    #editor:disabled { color:#777b84 }
    .welcome { width:min(620px,calc(100% - 48px)); padding:32px; border:1px solid #393b40; border-radius:12px; background:#25262a; box-shadow:0 18px 60px #0004 }
    .welcome h1 { margin:0 0 8px; font-size:25px } .welcome p { color:#a8abb3; line-height:1.55 }
    #properties { padding:8px 12px } .property { display:grid; grid-template-columns:minmax(90px,42%) 1fr; gap:10px; padding:7px 4px; border-bottom:1px solid #34363b; font-size:12px }
    .property span:first-child { color:#aeb1b8 } .property span:last-child { overflow-wrap:anywhere; color:#e1e3e7 }
    footer { height:24px; display:flex; align-items:center; justify-content:space-between; padding:0 10px; border-top:1px solid #393b40; background:#2b2d30; color:#a8abb3; font-size:11px }
    .error { color:#ff7b86 } .warning { color:#e7b75f } button { border:0; border-radius:5px; padding:5px 9px; background:#3c3f45; color:#dfe1e5; cursor:pointer } button:hover { background:#4b4e55 } button:disabled { opacity:.45; cursor:default } .primary { background:#365880 } .primary:hover { background:#416b9b }
    dialog { width:min(920px,calc(100% - 40px)); height:min(700px,calc(100% - 40px)); padding:0; border:1px solid #4a4d54; border-radius:10px; background:#25262a; color:#dfe1e5; box-shadow:0 24px 90px #000b }
    dialog::backdrop { background:#0009 } .git-header,.git-actions { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #393b40 } .git-header strong { flex:1 }
    .git-body { display:grid; grid-template-columns:280px 1fr; height:calc(100% - 96px) } .git-sidebar { overflow:auto; padding:10px; border-right:1px solid #393b40 } .git-main { min-width:0; display:grid; grid-template-rows:1fr auto; padding:10px }
    #git-changes { display:grid; gap:3px; margin-top:8px } .git-change { display:flex; gap:8px; width:100%; text-align:left; font:12px ui-monospace,monospace } .git-change span:first-child { color:#e7b75f } .git-change.conflict span { color:#ff7b86 }
    #git-diff,#git-output { overflow:auto; margin:0; padding:12px; border-radius:6px; background:#1e1f22; color:#c8ccd4; white-space:pre-wrap; font:12px/1.45 ui-monospace,monospace } #git-output { max-height:90px; margin-top:8px }
    .git-fields { display:grid; gap:8px; padding-top:10px } .git-fields input,.git-fields select { min-width:0; padding:7px; border:1px solid #4a4d54; border-radius:5px; background:#1e1f22; color:#dfe1e5 }
    .tool-header { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #393b40 } .tool-header strong { flex:1 }
    .search-fields { padding:10px 12px; border-bottom:1px solid #393b40 } .search-fields input { width:100%; padding:8px 10px; border:1px solid #4a4d54; border-radius:5px; outline:0; background:#1e1f22; color:#dfe1e5 } .search-fields input:focus { border-color:#5686b7 }
    #navigation-results { height:calc(100% - 48px); overflow:auto; padding:8px } #navigation-dialog.searching #navigation-results { height:calc(100% - 99px) }
    .navigation-result { display:grid; grid-template-columns:220px 70px minmax(0,1fr); gap:10px; width:100%; padding:7px 9px; background:transparent; text-align:left; font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace } .navigation-result:hover { background:#3c3f45 } .navigation-result-path,.navigation-result-preview { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap } .navigation-result-path { color:#6fa9e8 } .navigation-result-position { color:#92959d } .navigation-result-preview { color:#c8ccd4 } .navigation-empty { padding:24px; color:#92959d; text-align:center }
    .help-body { display:grid; grid-template-columns:300px minmax(0,1fr); height:calc(100% - 49px) } .help-index { min-width:0; padding:10px; overflow:auto; border-right:1px solid #393b40 } .help-index input { width:100%; padding:8px 10px; border:1px solid #4a4d54; border-radius:5px; outline:0; background:#1e1f22; color:#dfe1e5 } .help-index input:focus { border-color:#5686b7 } #help-results { display:grid; gap:2px; margin-top:8px } .help-result { display:grid; width:100%; padding:7px 8px; background:transparent; text-align:left } .help-result:hover { background:#3c3f45 } .help-result span:first-child { color:#dfe1e5 } .help-result span:last-child { color:#92959d; font-size:11px }
    #help-content { min-width:0; overflow:auto; padding:22px 26px; line-height:1.5 } #help-content h2 { margin:0 0 4px } #help-content h3 { margin:20px 0 6px; font-size:13px } .help-source { color:#92959d; font-size:12px } .help-signature { overflow:auto; padding:12px; border-radius:6px; background:#1e1f22; color:#d6b778; white-space:pre-wrap; font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace } .help-text { white-space:pre-wrap } .help-parameters { display:grid; gap:7px } .help-parameter { display:grid; grid-template-columns:minmax(140px,35%) 1fr; gap:12px } .help-parameter code { color:#82b9ed } .help-location { margin-top:20px }
    @media (max-width:850px) { .workspace { grid-template-columns:240px 1fr } #properties-panel { display:none } }
  </style>
</head>
<body>
  <header><strong>ML Studio</strong><span id="project-name"></span><span id="project-path" class="muted"></span><button id="search-open" title="Поиск по проекту (Ctrl/Cmd+Shift+F)">Поиск</button><button id="help-open" title="Локальный синтаксис-помощник">Синтаксис</button><button id="package-build">Собрать пакет</button><button id="git-open">Git</button><button id="refresh">Обновить</button></header>
  <div class="workspace">
    <aside id="tree-panel"><div class="panel-title"><span>ML Project</span></div><div id="tree"></div></aside>
    <main><div class="editor-bar"><span id="file-path">Выберите файл</span><span id="bsl-summary" class="muted"></span><button data-bsl-action="help" title="Справка по символу (F1)" hidden>F1</button><button data-bsl-action="definition" title="Перейти к определению (F12)" hidden>Определение</button><button data-bsl-action="usages" title="Найти использования (Shift+F12)" hidden>Использования</button><button data-bsl-action="rename" title="Переименовать (Shift+F6)" hidden>Переименовать</button><button id="save" class="primary" disabled>Сохранить</button></div><div id="editor-host"><div id="line-gutter"></div><div id="editor-stack"><pre id="syntax-layer" aria-hidden="true"><code id="syntax-code"></code></pre><textarea id="editor" wrap="off" spellcheck="false" disabled placeholder="Выберите YAML- или BSL-файл в дереве проекта"></textarea></div></div><div id="form-designer" hidden></div></main>
    <aside id="properties-panel"><div class="panel-title"><span id="inspector-title">Свойства</span><span id="selection" class="muted"></span></div><div id="properties"></div><div id="bsl-panel" hidden><section><h3>Структура модуля</h3><div id="bsl-symbols"></div></section><section><h3>Диагностика</h3><div id="bsl-diagnostics"></div></section></div></aside>
  </div>
  <footer><span id="status">Готово</span><span>UTF-8 · YAML · BSL</span></footer>
  <dialog id="git-dialog">
    <div class="git-header"><strong>Git</strong><span id="git-summary" class="muted"></span><button id="git-refresh">Обновить</button><button id="git-close">Закрыть</button></div>
    <div class="git-body">
      <div class="git-sidebar">
        <div class="git-fields"><select id="git-branch"></select><button id="git-switch">Переключить ветку</button><input id="git-new-branch" maxlength="240" placeholder="Новая ветка"><button id="git-create-branch">Создать ветку</button></div>
        <div id="git-changes"></div>
      </div>
      <div class="git-main"><pre id="git-diff">Выберите изменённый файл</pre><div><div class="git-fields"><input id="git-message" maxlength="4096" placeholder="Сообщение коммита"><button id="git-commit" class="primary">Создать commit</button></div><pre id="git-output"></pre></div></div>
    </div>
    <div class="git-actions"><button id="git-pull">Pull</button><button id="git-push">Push</button></div>
  </dialog>
  <dialog id="navigation-dialog">
    <div class="tool-header"><strong id="navigation-title">Поиск</strong><span id="navigation-summary" class="muted"></span><button id="navigation-close">Закрыть</button></div>
    <div id="search-fields" class="search-fields" hidden><input id="project-search" maxlength="256" autocomplete="off" placeholder="Объект, модуль, форма, макет или текст"></div>
    <div id="navigation-results"></div>
  </dialog>
  <dialog id="help-dialog">
    <div class="tool-header"><strong>Синтаксис-помощник</strong><span id="help-summary" class="muted"></span><button id="help-close">Закрыть</button></div>
    <div class="help-body"><aside class="help-index"><input id="help-search" maxlength="256" autocomplete="off" placeholder="Поиск по платформе и ML Project"><div id="help-results"></div></aside><article id="help-content"><div class="navigation-empty">Введите название или нажмите F1 на символе BSL.</div></article></div>
  </dialog>
  <script src="/ui/bsl-editor.js"></script>
  <script src="/ui/form-designer.js"></script>
  <script>
    const tree=document.querySelector('#tree'),properties=document.querySelector('#properties'),status=document.querySelector('#status'),editor=document.querySelector('#editor'),editorHost=document.querySelector('#editor-host'),formHost=document.querySelector('#form-designer'),saveButton=document.querySelector('#save'),filePath=document.querySelector('#file-path');
    const bslEditor=createBSLEditor(editor);
    const formDesigner=createFormDesigner(formHost,properties,()=>{if(!currentFile?.isForm)return;dirty=JSON.stringify(formDesigner.value().form)!==currentFile.initialForm;saveButton.disabled=!dirty;status.className='';status.textContent=dirty?'Форма изменена':'Готово'},createFormHandler);
    let selectedElement,currentFile=null,dirty=false,loadingFile=false,projectName='project';
    function editablePath(value){return value==='mlproject.yaml'||value?.endsWith('.yaml')||value?.endsWith('.bsl')}
    async function select(node,element){if(editablePath(node.path)&&currentFile?.path!==node.path&&!await openFile(node.path))return;if(selectedElement)selectedElement.classList.remove('selected');selectedElement=element;element.classList.add('selected');document.querySelector('#selection').textContent=node.title;if(currentFile?.isForm&&currentFile.path===node.path)return;properties.replaceChildren();for(const item of node.properties||[]){const row=document.createElement('div');row.className='property';const name=document.createElement('span'),value=document.createElement('span');name.textContent=item.name;value.textContent=item.value;row.append(name,value);properties.append(row)}}
    function renderNode(node){if(node.children&&node.children.length){const details=document.createElement('details');details.open=node.id==='project'||node.id==='metadata';const summary=document.createElement('summary');const icon=document.createElement('span');icon.className='icon';icon.textContent='◆';const title=document.createElement('span');title.textContent=node.title;summary.append(icon,title);summary.addEventListener('click',event=>{event.stopPropagation();select(node,summary)});const children=document.createElement('div');children.className='children';for(const child of node.children)children.append(renderNode(child));details.append(summary,children);return details}const leaf=document.createElement('div');leaf.className='leaf';const icon=document.createElement('span');icon.className='icon';icon.textContent=node.kind==='group'||node.kind==='metadata-group'?'◆':'●';const title=document.createElement('span');title.textContent=node.title;leaf.append(icon,title);leaf.addEventListener('click',()=>select(node,leaf));return leaf}
    function showSourceEditor(file){formDesigner.close(true);formHost.hidden=true;editorHost.hidden=false;editor.value=file.content;editor.disabled=false;bslEditor.open(file)}
    function showFormEditor(value){editorHost.hidden=true;bslEditor.close();formDesigner.open(value)}
    async function loadManagedForm(path){const response=await fetch(`/api/form?path=${encodeURIComponent(path)}`);if(!response.ok)throw new Error(await response.text());const value=await response.json();value.isForm=true;value.initialForm=JSON.stringify(value.form);currentFile=value;showFormEditor(value)}
    async function openFile(path){if(loadingFile)return false;if(currentFile?.path===path)return true;if(dirty&&!confirm('Текущий файл изменён. Отменить несохранённые изменения?'))return false;loadingFile=true;status.textContent='Открытие файла…';try{if(/^forms\/[0-9a-f-]{36}\.yaml$/.test(path)){await loadManagedForm(path)}else{const response=await fetch(`/api/file?path=${encodeURIComponent(path)}`);if(!response.ok)throw new Error(await response.text());currentFile=await response.json();currentFile.isForm=false;showSourceEditor(currentFile)}filePath.textContent=currentFile.path;dirty=false;saveButton.disabled=true;status.className='';status.textContent=currentFile.isForm?'Конструктор форм · Готово':`${currentFile.language.toUpperCase()} · Готово`;return true}catch(error){status.textContent=String(error.message||error);status.className='error';return false}finally{loadingFile=false}}
    async function createFormHandler(command){if(!currentFile?.isForm)return;try{if(!await save())return;status.className='';status.textContent='Подготовка обработчика…';const response=await fetch('/api/form/handler',{method:'POST',headers:{'Content-Type':'application/json','X-ML-CSRF':'1'},body:JSON.stringify({path:currentFile.path,expectedRevision:currentFile.revision,command})});if(!response.ok)throw new Error(await response.text());const result=await response.json();result.form.isForm=true;result.form.initialForm=JSON.stringify(result.form.form);currentFile=result.form;dirty=false;saveButton.disabled=true;await loadTree(false);if(await openFile(result.module.path)){const position=result.created?{line:result.location.range.start.line+2,column:1}:result.location.range.start;bslEditor.goTo(position);status.textContent=result.created?'Обработчик создан':'Обработчик открыт'}}catch(error){status.textContent=String(error.message||error).trim();status.className='error'}}
    async function save(){if(!currentFile)return false;if(!dirty)return true;saveButton.disabled=true;status.className='';status.textContent='Сохранение…';let endpoint='/api/file',payload={path:currentFile.path,content:bslEditor.source(),expectedRevision:currentFile.revision};if(currentFile.isForm){endpoint='/api/form';payload={path:currentFile.path,form:formDesigner.value().form,expectedRevision:currentFile.revision}}const response=await fetch(endpoint,{method:'PUT',headers:{'Content-Type':'application/json','X-ML-CSRF':'1'},body:JSON.stringify(payload)});if(!response.ok){status.textContent=response.status===409?'Файл изменён вне Studio. Перезагрузите его и объедините изменения.':await response.text();status.className=response.status===409?'warning':'error';saveButton.disabled=false;return false}if(currentFile.isForm){const value=await response.json();value.isForm=true;value.initialForm=JSON.stringify(value.form);currentFile=value;showFormEditor(value)}else{currentFile=await response.json();showSourceEditor(currentFile)}dirty=false;saveButton.disabled=true;status.className='';status.textContent='Сохранено';await loadTree(false);return true}
    async function loadTree(selectRoot=true){status.textContent='Обновление…';status.className='';const response=await fetch('/api/project');if(!response.ok){status.textContent=await response.text();status.className='error';return}const data=await response.json(),manifest=data.manifest;projectName=manifest.name||manifest.Name;const title=manifest.title||manifest.Title;document.title=`ML Studio — ${title}`;document.querySelector('#project-name').textContent=title;document.querySelector('#project-path').textContent=data.projectPath;tree.replaceChildren(renderNode(data.tree));if(selectRoot)await select(data.tree,tree.querySelector('summary'));if(!dirty){status.className='';status.textContent='Готово'}}
    async function pollExternalChange(){if(!currentFile||loadingFile)return;const knownRevision=currentFile.externalRevision||currentFile.revision;const response=await fetch(`/api/file?path=${encodeURIComponent(currentFile.path)}`,{headers:{'If-None-Match':`"${knownRevision}"`}});if(response.status===304||!response.ok)return;const latest=await response.json();if(latest.revision===currentFile.revision){delete currentFile.externalRevision;return}if(dirty){currentFile.externalRevision=latest.revision;status.textContent='Файл изменён вне Studio. Сохранение заблокировано до перезагрузки.';status.className='warning';return}if(currentFile.isForm)await loadManagedForm(currentFile.path);else{currentFile=latest;showSourceEditor(currentFile)}status.textContent='Загружены внешние изменения';status.className='warning'}
    const navigationDialog=document.querySelector('#navigation-dialog'),navigationTitle=document.querySelector('#navigation-title'),navigationSummary=document.querySelector('#navigation-summary'),navigationResults=document.querySelector('#navigation-results'),searchFields=document.querySelector('#search-fields'),projectSearch=document.querySelector('#project-search');let searchTimer=0,searchGeneration=0;
    function showToolError(error){status.textContent=String(error?.message||error).trim();status.className='error'}
    async function openLocation(location){if(!location)return;const opened=await openFile(location.path);if(!opened)return;if(navigationDialog.open)navigationDialog.close();bslEditor.goTo(location.range.start);status.className='';status.textContent=`${location.path}:${location.range.start.line}:${location.range.start.column}`}
    function renderLocations(title,locations,truncated=false){navigationDialog.classList.remove('searching');searchFields.hidden=true;navigationTitle.textContent=title;navigationSummary.textContent=`Найдено: ${locations.length}${truncated?' · результат ограничен':''}`;navigationResults.replaceChildren();if(!locations.length){const empty=document.createElement('div');empty.className='navigation-empty';empty.textContent='Ничего не найдено';navigationResults.append(empty)}for(const location of locations){const button=document.createElement('button');button.type='button';button.className='navigation-result';const path=document.createElement('span'),position=document.createElement('span'),preview=document.createElement('span');path.className='navigation-result-path';path.textContent=location.path;position.className='navigation-result-position';position.textContent=`${location.range.start.line}:${location.range.start.column}`;preview.className='navigation-result-preview';preview.textContent=location.preview||location.kind||'';button.append(path,position,preview);button.addEventListener('click',()=>openLocation(location));navigationResults.append(button)}if(!navigationDialog.open)navigationDialog.showModal()}
    async function runBSLAction(action){try{if(action==='help'){renderHelpItem(await bslEditor.help());openHelp();return}if(action==='definition'){const result=await bslEditor.navigate('definition');await openLocation(result.locations[0]);return}if(action==='usages'){const result=await bslEditor.navigate('usages');renderLocations(`Использования: ${result.symbol.name}`,result.locations,result.truncated);return}if(action==='rename'){if(dirty){status.textContent='Сначала сохраните текущий модуль.';status.className='warning';return}const navigation=await bslEditor.navigate('usages');if(!navigation.symbol.canRename){status.textContent='Этот символ нельзя переименовать из BSL.';status.className='warning';return}const newName=prompt(`Новое имя для ${navigation.symbol.name}:`,navigation.symbol.name);if(newName===null||newName.trim()===navigation.symbol.name)return;if(!confirm(`Переименовать «${navigation.symbol.name}» в «${newName.trim()}»? Будет изменено мест: ${navigation.locations.length+1}.`))return;const renamed=await bslEditor.rename(newName.trim());currentFile=renamed.current;editor.value=currentFile.content;dirty=false;saveButton.disabled=true;bslEditor.open(currentFile);await loadTree(false);status.className='';status.textContent=`Переименовано файлов: ${renamed.changed.length}`}}catch(error){showToolError(error)}}
    document.querySelectorAll('[data-bsl-action]').forEach(button=>button.addEventListener('click',()=>runBSLAction(button.dataset.bslAction)));window.addEventListener('ml-bsl-action',event=>runBSLAction(event.detail.action));
    function openProjectSearch(){navigationDialog.classList.add('searching');searchFields.hidden=false;navigationTitle.textContent='Поиск по ML Project';navigationSummary.textContent='';navigationResults.replaceChildren();if(!navigationDialog.open)navigationDialog.showModal();projectSearch.focus();projectSearch.select();if(projectSearch.value.trim())runProjectSearch()}
    async function runProjectSearch(){const query=projectSearch.value.trim(),generation=++searchGeneration;if(!query){navigationSummary.textContent='';navigationResults.replaceChildren();return}navigationSummary.textContent='Поиск…';try{const response=await fetch(`/api/search?query=${encodeURIComponent(query)}`);if(!response.ok)throw new Error(await response.text());const result=await response.json();if(generation!==searchGeneration)return;navigationSummary.textContent=`Найдено: ${result.locations.length}${result.truncated?' · результат ограничен':''}`;navigationResults.replaceChildren();if(!result.locations.length){const empty=document.createElement('div');empty.className='navigation-empty';empty.textContent='Ничего не найдено';navigationResults.append(empty)}for(const location of result.locations){const button=document.createElement('button');button.type='button';button.className='navigation-result';const path=document.createElement('span'),position=document.createElement('span'),preview=document.createElement('span');path.className='navigation-result-path';path.textContent=location.path;position.className='navigation-result-position';position.textContent=`${location.range.start.line}:${location.range.start.column}`;preview.className='navigation-result-preview';preview.textContent=location.preview||'';button.append(path,position,preview);button.addEventListener('click',()=>openLocation(location));navigationResults.append(button)}}catch(error){if(generation===searchGeneration){navigationSummary.textContent='Ошибка';navigationResults.textContent=String(error.message||error)}}}
    document.querySelector('#search-open').addEventListener('click',openProjectSearch);document.querySelector('#navigation-close').addEventListener('click',()=>navigationDialog.close());projectSearch.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(runProjectSearch,160)});document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.shiftKey&&event.key.toLowerCase()==='f'){event.preventDefault();openProjectSearch()}});
    const helpDialog=document.querySelector('#help-dialog'),helpSearch=document.querySelector('#help-search'),helpResults=document.querySelector('#help-results'),helpContent=document.querySelector('#help-content'),helpSummary=document.querySelector('#help-summary');let helpTimer=0,helpGeneration=0;
    function openHelp(){if(!helpDialog.open)helpDialog.showModal()}
    function textElement(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;node.textContent=text;return node}
    function renderHelpItem(item){helpContent.replaceChildren();helpContent.append(textElement('h2','',item.name),textElement('div','help-source',`${item.kind} · ${item.source}`));if(item.signature)helpContent.append(textElement('pre','help-signature',item.signature));helpContent.append(textElement('p','help-text',item.summary));if(item.description&&item.description!==item.summary)helpContent.append(textElement('p','help-text',item.description));if(item.parameters?.length){helpContent.append(textElement('h3','','Параметры'));const list=textElement('div','help-parameters','');for(const parameter of item.parameters){const row=textElement('div','help-parameter','');row.append(textElement('code','',parameter.label),textElement('span','',parameter.description||''));list.append(row)}helpContent.append(list)}if(item.returns){helpContent.append(textElement('h3','','Возвращаемое значение'),textElement('div','help-text',item.returns))}if(item.location){const button=textElement('button','help-location','Открыть определение');button.addEventListener('click',async()=>{helpDialog.close();await openLocation(item.location)});helpContent.append(button)}}
    async function searchHelp(){const query=helpSearch.value.trim(),generation=++helpGeneration;if(!query){helpSummary.textContent='';helpResults.replaceChildren();return}helpSummary.textContent='Поиск…';try{const response=await fetch(`/api/bsl/help?query=${encodeURIComponent(query)}`);if(!response.ok)throw new Error(await response.text());const result=await response.json();if(generation!==helpGeneration)return;helpSummary.textContent=`Найдено: ${result.items.length}${result.truncated?' · результат ограничен':''}`;helpResults.replaceChildren();if(!result.items.length)helpResults.append(textElement('div','navigation-empty','Ничего не найдено'));for(const item of result.items){const button=textElement('button','help-result','');button.type='button';button.append(textElement('span','',item.name),textElement('span','',`${item.kind} · ${item.source}`));button.addEventListener('click',()=>renderHelpItem(item));helpResults.append(button)}}catch(error){if(generation===helpGeneration){helpSummary.textContent='Ошибка';helpResults.textContent=String(error.message||error)}}}
    document.querySelector('#help-open').addEventListener('click',()=>{openHelp();helpSearch.focus();helpSearch.select();if(helpSearch.value.trim())searchHelp()});document.querySelector('#help-close').addEventListener('click',()=>helpDialog.close());helpSearch.addEventListener('input',()=>{clearTimeout(helpTimer);helpTimer=setTimeout(searchHelp,160)});
    const gitDialog=document.querySelector('#git-dialog'),gitOutput=document.querySelector('#git-output'),gitDiff=document.querySelector('#git-diff');
    async function refreshGit(clearOutput=true){if(clearOutput)gitOutput.textContent='';const [statusResponse,branchesResponse]=await Promise.all([fetch('/api/git/status'),fetch('/api/git/branches')]);if(!statusResponse.ok){gitOutput.textContent=await statusResponse.text();return}const data=await statusResponse.json(),branches=branchesResponse.ok?await branchesResponse.json():{current:data.branch,items:[data.branch]};const conflicts=data.entries.filter(entry=>entry.conflicted).length;document.querySelector('#git-summary').textContent=`${data.branch||'без ветки'} · ${data.entries.length} изменений${conflicts?` · конфликтов: ${conflicts}`:''}${data.ahead||data.behind?` · ↑${data.ahead} ↓${data.behind}`:''}`;const branch=document.querySelector('#git-branch');branch.replaceChildren();for(const name of branches.items){const option=document.createElement('option');option.value=option.textContent=name;option.selected=name===branches.current;branch.append(option)}const changes=document.querySelector('#git-changes');changes.replaceChildren();for(const entry of data.entries){const button=document.createElement('button');button.className=`git-change${entry.conflicted?' conflict':''}`;const code=document.createElement('span'),path=document.createElement('span');code.textContent=`${entry.index}${entry.worktree}`;path.textContent=entry.path;button.append(code,path);button.addEventListener('click',()=>showGitDiff(entry));changes.append(button)}if(!data.entries.length)changes.textContent='Нет изменений'}
    async function showGitDiff(entry){const response=await fetch(`/api/git/diff?path=${encodeURIComponent(entry.path)}`);if(!response.ok){gitDiff.textContent=await response.text();return}const data=await response.json();gitDiff.textContent=data.diff||(entry.index==='?'?'Новый файл. Diff появится после добавления в индекс.':'Нет текстовых различий')}
    async function gitAction(path,body){if(dirty){gitOutput.textContent='Сначала сохраните текущий файл.';return false}gitOutput.textContent='Выполнение…';const options={method:'POST',headers:{'X-ML-CSRF':'1'}};if(body!==undefined){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}const response=await fetch(path,options);const text=await response.text();if(!response.ok){gitOutput.textContent=text;return false}try{gitOutput.textContent=JSON.parse(text).output||'Готово'}catch{gitOutput.textContent='Готово'}await refreshGit(false);return true}
    document.querySelector('#git-open').addEventListener('click',()=>{gitDialog.showModal();refreshGit()});document.querySelector('#git-close').addEventListener('click',()=>gitDialog.close());document.querySelector('#git-refresh').addEventListener('click',refreshGit);
    function closeFile(){currentFile=null;dirty=false;editor.value='';editor.disabled=true;editorHost.hidden=false;formDesigner.close();saveButton.disabled=true;filePath.textContent='Выберите файл';bslEditor.close()}
    document.querySelector('#git-commit').addEventListener('click',async()=>{if(await gitAction('/api/git/commit',{message:document.querySelector('#git-message').value}))document.querySelector('#git-message').value=''});document.querySelector('#git-pull').addEventListener('click',async()=>{if(await gitAction('/api/git/pull')){closeFile();await loadTree()}});document.querySelector('#git-push').addEventListener('click',()=>gitAction('/api/git/push'));
    document.querySelector('#git-switch').addEventListener('click',async()=>{if(await gitAction('/api/git/branches/switch',{name:document.querySelector('#git-branch').value,create:false})){closeFile();await loadTree()}});document.querySelector('#git-create-branch').addEventListener('click',async()=>{const input=document.querySelector('#git-new-branch');if(await gitAction('/api/git/branches/switch',{name:input.value,create:true})){input.value='';closeFile();await loadTree()}});
    document.querySelector('#package-build').addEventListener('click',async()=>{if(dirty){status.textContent='Сначала сохраните текущий файл.';status.className='warning';return}status.textContent='Сборка пакета…';status.className='';const response=await fetch('/api/publication/package',{method:'POST',headers:{'X-ML-CSRF':'1'}});if(!response.ok){status.textContent=await response.text();status.className='error';return}const blob=await response.blob(),link=document.createElement('a'),url=URL.createObjectURL(blob);link.href=url;link.download=`${projectName}.mlpkg`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent=`Пакет собран · ${response.headers.get('X-ML-Package-Digest')?.slice(0,12)||''}`});
    editor.addEventListener('input',()=>{if(!currentFile||currentFile.isForm)return;bslEditor.change(editor.value);dirty=bslEditor.source()!==currentFile.content;saveButton.disabled=!dirty;status.className='';status.textContent=dirty?'Изменён':'Готово'});editor.addEventListener('keydown',event=>{if(event.key==='Tab'&&!editor.readOnly){event.preventDefault();const start=editor.selectionStart;editor.setRangeText('    ',start,editor.selectionEnd,'end');editor.dispatchEvent(new Event('input'))}});document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='s'){event.preventDefault();save()}});saveButton.addEventListener('click',save);window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue=''}});
    document.querySelector('#refresh').addEventListener('click',async()=>{if(dirty&&!confirm('Отменить несохранённые изменения и перечитать проект?'))return;closeFile();await loadTree()});loadTree();setInterval(pollExternalChange,3000);
  </script>
