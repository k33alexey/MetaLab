name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metalab
          POSTGRES_PASSWORD: metalab
          POSTGRES_DB: metalab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metalab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ML_TEST_DATABASE_URL: postgres://metalab:metalab@127.0.0.1:5432/metalab?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(find . -type f -name '*.go' -not -path './vendor/*')"
          unformatted="$(gofmt -l $files)"
          test -z "$unformatted" || (printf '%s\n' "$unformatted" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./cmd/ml

      - name: WebAssembly smoke test
        run: make test-wasm
