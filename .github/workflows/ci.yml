name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The tests under the race detector take most of it: Studio alone 246 s
    # with the walk of every editor in a browser (2.296).
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metalab
          POSTGRES_PASSWORD: metalab
          POSTGRES_DB: metalab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metalab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ML_TEST_DATABASE_URL: postgres://metalab:metalab@127.0.0.1:5432/metalab?sslmode=disable
      ML_TEST_ADMIN_DATABASE_URL: postgres://metalab:metalab@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(find . -type f -name '*.go' -not -path './vendor/*')"
          unformatted="$(gofmt -l $files)"
          test -z "$unformatted" || (printf '%s\n' "$unformatted" && exit 1)

      # One piece of knowledge lives in one place: a new copy of Go code fails
      # the build the way an unformatted file does. The copies that were there
      # when the check came in are in scripts/dupl-baseline.txt, which shrinks.
      - name: Check for copied code
        run: python3 scripts/dupl_check.py

      - name: Vet
        run: go vet ./...

      - name: Check browser modules
        run: node --check internal/mlapp/ui/app.js

      # The sweep itself needs the prototype's export, which is not in the
      # repository; its matcher needs only names. The matcher went quiet on a
      # real gap five times in one day, so its own checks run here.
      - name: Check the metadata sweep matcher
        run: python3 scripts/metadata_sweep.py --self-check

      # -p 1 runs one package's tests at a time. It is not a speed setting: the
      # integration tests of internal/metadata, internal/platform,
      # internal/publication and internal/studio create, migrate and drop the
      # same ml_data schema in the one test database. Run in parallel, one
      # package drops the schema while another works in it, and the job fails
      # with 'schema "ml_data" does not exist', 'relation "ml_data.t_..." does
      # not exist' or 'PostgreSQL schema changed after the migration plan was
      # prepared' - every one of which reads as a regression and is not one.
      # See AGENTS.md, "PostgreSQL integration tests".
      - name: Test with race detector
        run: go test -race -p 1 -coverprofile=coverage.out ./...

      # The budgets of ML-STUDIO.md are set for the developer's machine; the
      # runner is slower and says by how much, so the numbers themselves stay
      # as written. The race detector would slow them fifteen times, so they
      # are measured in a run of their own.
      - name: Responsiveness budgets
        env:
          ML_BUDGET_SCALE: "2"
        run: make test-budgets

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage
          path: coverage.out

      - name: Build
        run: go build ./cmd/ml

      - name: Build Windows desktop binary
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop -o /tmp/ml.exe ./cmd/ml

      - name: WebAssembly smoke test
        run: make test-wasm

  # Secret files are closed to other users by Windows ACLs, which the Linux
  # job only compiles. Here the ACLs Windows actually keeps are read back, and
  # the native secret store writes, reads and deletes a real secret.
  windows-secrets:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test secret files and the secret store
        env:
          ML_TEST_NATIVE_SECRET_STORE: "1"
        run: go test ./internal/ownerfile/ ./internal/secretstore/ ./internal/postgresconn/ ./internal/pgcopy/ ./internal/pgbackup/
