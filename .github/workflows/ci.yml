name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metalab
          POSTGRES_PASSWORD: metalab
          POSTGRES_DB: metalab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metalab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ML_TEST_DATABASE_URL: postgres://metalab:metalab@127.0.0.1:5432/metalab?sslmode=disable
      ML_TEST_ADMIN_DATABASE_URL: postgres://metalab:metalab@127.0.0.1:5432/postgres?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files="$(find . -type f -name '*.go' -not -path './vendor/*')"
          unformatted="$(gofmt -l $files)"
          test -z "$unformatted" || (printf '%s\n' "$unformatted" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Check browser modules
        run: node --check internal/mlapp/ui/app.js

      # -p 1 runs one package's tests at a time. It is not a speed setting: the
      # integration tests of internal/metadata, internal/platform,
      # internal/publication and internal/studio create, migrate and drop the
      # same ml_data schema in the one test database. Run in parallel, one
      # package drops the schema while another works in it, and the job fails
      # with 'schema "ml_data" does not exist', 'relation "ml_data.t_..." does
      # not exist' or 'PostgreSQL schema changed after the migration plan was
      # prepared' - every one of which reads as a regression and is not one.
      # See AGENTS.md, "PostgreSQL integration tests".
      - name: Test with race detector
        run: go test -race -p 1 -coverprofile=coverage.out ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: go-coverage
          path: coverage.out

      - name: Build
        run: go build ./cmd/ml

      - name: Build Windows desktop binary
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags desktop -o /tmp/ml.exe ./cmd/ml

      - name: WebAssembly smoke test
        run: make test-wasm
