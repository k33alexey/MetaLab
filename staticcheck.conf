# The default set of staticcheck, minus ST1005.
#
# ST1005 wants error strings to begin with a lower-case letter. Ours begin with
# names: of BSL types (Structure, Query), of products (Git, ML Project), and
# lowering them makes the message worse, not better. Everything else of the
# default set is on.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1005"]
